<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/layout :: head('새 작품 추가')}"></head>
<body class="bg-gray-50 antialiased">
<div class="flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <aside th:replace="~{admin/fragments/layout :: sidebar}"></aside>

    <!-- Main -->
    <div class="flex-1 flex flex-col min-w-0 overflow-auto">
        <div th:replace="~{admin/fragments/layout :: toast}"></div>

        <main class="flex-1 p-8">

            <!-- Breadcrumb -->
            <div class="flex items-center gap-2 text-sm text-gray-500 mb-6">
                <a href="/admin" class="hover:text-indigo-600 transition-colors">대시보드</a>
                <i class="fas fa-chevron-right text-xs text-gray-300"></i>
                <a th:href="@{/admin/exhibitions/{id}/productions(id=${exhibitionId})}"
                   class="hover:text-indigo-600 transition-colors">작품 목록</a>
                <i class="fas fa-chevron-right text-xs text-gray-300"></i>
                <span class="text-gray-700 font-medium">새 작품 추가</span>
            </div>

            <!-- Form Card -->
            <div class="max-w-2xl bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden">
                <!-- Header -->
                <div class="px-8 py-6 border-b border-gray-100">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl bg-violet-50 flex items-center justify-center">
                            <i class="fas fa-palette text-violet-500"></i>
                        </div>
                        <div>
                            <h1 class="text-lg font-bold text-gray-900">새 작품 추가</h1>
                            <p class="text-sm text-gray-500">작품 정보와 이미지를 등록하세요.</p>
                        </div>
                    </div>
                </div>

                <!-- Form Body -->
                <form th:action="@{/admin/exhibitions/{id}/productions(id=${exhibitionId})}"
                      th:object="${productionRequestDto}"
                      method="post"
                      enctype="multipart/form-data"
                      class="px-8 py-6 space-y-5">

                    <div class="grid grid-cols-2 gap-4">
                        <!-- Teamname -->
                        <div>
                            <label for="teamname" class="block text-sm font-semibold text-gray-700 mb-1.5">팀명</label>
                            <input type="text" id="teamname" th:field="*{teamname}"
                                   class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-shadow"
                                   placeholder="팀 이름">
                        </div>
                        <!-- Generation -->
                        <div>
                            <label for="generation" class="block text-sm font-semibold text-gray-700 mb-1.5">기수</label>
                            <input type="number" id="generation" th:field="*{generation}"
                                   class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-shadow"
                                   placeholder="예: 5">
                        </div>
                    </div>

                    <!-- Title -->
                    <div>
                        <label for="title" class="block text-sm font-semibold text-gray-700 mb-1.5">작품 제목</label>
                        <input type="text" id="title" th:field="*{title}"
                               class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-shadow"
                               placeholder="작품 제목을 입력하세요">
                    </div>

                    <!-- Description -->
                    <div>
                        <label for="description" class="block text-sm font-semibold text-gray-700 mb-1.5">작품 설명</label>
                        <textarea id="description" th:field="*{description}" rows="5"
                                  class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-shadow resize-none"
                                  placeholder="작품에 대한 상세 설명을 입력하세요. AI 도슨트에서 활용됩니다."></textarea>
                    </div>

                    <!-- File Upload -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1.5">이미지 파일</label>
                        <div id="dropZone"
                             class="drop-zone rounded-xl p-6 text-center cursor-pointer bg-gray-50 hover:bg-gray-100 transition-colors"
                             onclick="document.getElementById('files').click()"
                             ondragover="event.preventDefault(); this.classList.add('drag-over')"
                             ondragleave="this.classList.remove('drag-over')"
                             ondrop="handleDrop(event)">
                            <i class="fas fa-cloud-arrow-up text-3xl text-gray-300 mb-2"></i>
                            <p class="text-sm font-medium text-gray-600">클릭 또는 파일을 여기에 드래그하세요</p>
                            <p class="text-xs text-gray-400 mt-1">PNG, JPG, GIF 지원 · 다중 선택 가능 · 최대 100MB</p>
                        </div>
                        <input type="file" id="files" name="files" multiple
                               class="hidden"
                               onchange="showPreviews(this.files)">
                        <!-- Preview Grid -->
                        <div id="previewGrid" class="grid grid-cols-4 gap-3 mt-3 hidden"></div>
                    </div>

                    <!-- Actions -->
                    <div class="flex items-center gap-3 pt-3 border-t border-gray-100">
                        <button type="submit"
                                class="flex-1 flex items-center justify-center gap-2 px-5 py-3 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold rounded-xl shadow-sm transition-colors">
                            <i class="fas fa-check"></i>
                            작품 등록
                        </button>
                        <a th:href="@{/admin/exhibitions/{id}/productions(id=${exhibitionId})}"
                           class="px-5 py-3 border border-gray-200 text-gray-600 text-sm font-medium rounded-xl hover:bg-gray-50 transition-colors">
                            취소
                        </a>
                    </div>
                </form>
            </div>

        </main>
    </div>
</div>

<script>
    function handleDrop(e) {
        e.preventDefault();
        document.getElementById('dropZone').classList.remove('drag-over');
        var dt = e.dataTransfer;
        var files = dt.files;
        document.getElementById('files').files = files;
        showPreviews(files);
    }

    function showPreviews(files) {
        var grid = document.getElementById('previewGrid');
        grid.innerHTML = '';
        if (!files || files.length === 0) { grid.classList.add('hidden'); return; }
        grid.classList.remove('hidden');

        Array.from(files).forEach(function(file) {
            var wrapper = document.createElement('div');
            wrapper.className = 'relative rounded-lg overflow-hidden border border-gray-200 bg-gray-50 aspect-square';

            if (file.type.startsWith('image/')) {
                var reader = new FileReader();
                reader.onload = function(e) {
                    var img = document.createElement('img');
                    img.src = e.target.result;
                    img.className = 'w-full h-full object-cover';
                    wrapper.appendChild(img);
                };
                reader.readAsDataURL(file);
            } else {
                var icon = document.createElement('div');
                icon.className = 'w-full h-full flex flex-col items-center justify-center p-2';
                icon.innerHTML = '<i class="fas fa-file text-gray-400 text-2xl mb-1"></i><span class="text-xs text-gray-500 text-center break-all leading-tight">' + file.name + '</span>';
                wrapper.appendChild(icon);
            }

            var label = document.createElement('div');
            label.className = 'absolute bottom-0 inset-x-0 bg-black/40 text-white text-xs px-1.5 py-0.5 truncate';
            label.textContent = file.name;
            wrapper.appendChild(label);

            grid.appendChild(wrapper);
        });

        // Update drop zone text
        document.getElementById('dropZone').innerHTML =
            '<i class="fas fa-check-circle text-2xl text-emerald-400 mb-1"></i>' +
            '<p class="text-sm font-medium text-gray-700">' + files.length + '개 파일 선택됨</p>' +
            '<p class="text-xs text-gray-400 mt-0.5">다시 클릭해 변경할 수 있습니다</p>';
    }
</script>
</body>
</html>
