<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/layout :: head('작품 수정')}"></head>
<body class="bg-gray-50 antialiased">
<div class="flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <aside th:replace="~{admin/fragments/layout :: sidebar}"></aside>

    <!-- Main -->
    <div class="flex-1 flex flex-col min-w-0 overflow-auto">
        <div th:replace="~{admin/fragments/layout :: toast}"></div>

        <main class="flex-1 p-8">

            <!-- Breadcrumb -->
            <div class="flex items-center gap-2 text-sm text-gray-500 mb-6">
                <a href="/admin" class="hover:text-indigo-600 transition-colors">대시보드</a>
                <i class="fas fa-chevron-right text-xs text-gray-300"></i>
                <a th:href="@{/admin/exhibitions/{id}/productions(id=${exhibitionId})}"
                   class="hover:text-indigo-600 transition-colors">작품 목록</a>
                <i class="fas fa-chevron-right text-xs text-gray-300"></i>
                <span class="text-gray-700 font-medium" th:text="${productionDto.title}">작품 수정</span>
            </div>

            <!-- Form Card -->
            <div class="max-w-2xl bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden">
                <!-- Header -->
                <div class="px-8 py-6 border-b border-gray-100">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl bg-amber-50 flex items-center justify-center">
                            <i class="fas fa-pen-to-square text-amber-500"></i>
                        </div>
                        <div>
                            <h1 class="text-lg font-bold text-gray-900">작품 수정</h1>
                            <p class="text-sm text-gray-500" th:text="${productionDto.title}"></p>
                        </div>
                    </div>
                </div>

                <!-- Form Body -->
                <form th:action="@{/admin/exhibitions/{eid}/productions/{pid}/edit(eid=${exhibitionId}, pid=${productionDto.id})}"
                      th:object="${productionDto}"
                      method="post"
                      enctype="multipart/form-data"
                      class="px-8 py-6 space-y-5">

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label for="teamname" class="block text-sm font-semibold text-gray-700 mb-1.5">팀명</label>
                            <input type="text" id="teamname" th:field="*{teamname}"
                                   class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-shadow">
                        </div>
                        <div>
                            <label for="generation" class="block text-sm font-semibold text-gray-700 mb-1.5">기수</label>
                            <input type="number" id="generation" th:field="*{generation}"
                                   class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-shadow">
                        </div>
                    </div>

                    <div>
                        <label for="title" class="block text-sm font-semibold text-gray-700 mb-1.5">작품 제목</label>
                        <input type="text" id="title" th:field="*{title}"
                               class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-shadow">
                    </div>

                    <div>
                        <label for="description" class="block text-sm font-semibold text-gray-700 mb-1.5">작품 설명</label>
                        <textarea id="description" th:field="*{description}" rows="5"
                                  class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-shadow resize-none"
                                  placeholder="작품 설명을 입력하세요. AI 도슨트에서 활용됩니다."></textarea>
                    </div>

                    <!-- Current Files -->
                    <div th:if="${!productionDto.files.isEmpty()}">
                        <label class="block text-sm font-semibold text-gray-700 mb-2">
                            현재 파일
                            <span class="text-xs font-normal text-gray-400 ml-1">삭제할 파일을 선택하세요</span>
                        </label>
                        <div class="grid grid-cols-2 gap-3">
                            <label th:each="file : *{files}"
                                   class="flex items-center gap-3 p-3 border border-gray-200 rounded-xl cursor-pointer hover:border-red-300 hover:bg-red-50 transition-colors"
                                   onclick="this.classList.toggle('border-red-400'); this.classList.toggle('bg-red-50')">
                                <input type="checkbox" name="deleteFileIds" th:value="${file.id}"
                                       class="w-4 h-4 accent-red-500 flex-shrink-0"
                                       onclick="event.stopPropagation()">
                                <img th:src="${file.path[0]}" alt="파일 미리보기"
                                     class="w-10 h-10 object-cover rounded-lg border border-gray-200 flex-shrink-0">
                                <div class="flex-1 min-w-0">
                                    <p class="text-xs font-medium text-gray-700 truncate" th:text="${file.originalFileName}"></p>
                                    <div class="flex items-center gap-1.5 mt-0.5">
                                        <span th:if="${file.type == 'ANIMATED'}"
                                              class="text-xs bg-blue-100 text-blue-600 px-1.5 py-0.5 rounded-full font-medium"
                                              th:text="${#lists.size(file.path)} + ' frames'"></span>
                                        <span th:if="${file.type == 'STATIC'}"
                                              class="text-xs bg-gray-100 text-gray-500 px-1.5 py-0.5 rounded-full font-medium">이미지</span>
                                    </div>
                                </div>
                            </label>
                        </div>
                    </div>

                    <!-- Add New Files -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1.5">새 파일 추가</label>
                        <div id="editDropZone"
                             class="drop-zone rounded-xl p-5 text-center cursor-pointer bg-gray-50 hover:bg-gray-100 transition-colors"
                             onclick="document.getElementById('addFiles').click()"
                             ondragover="event.preventDefault(); this.classList.add('drag-over')"
                             ondragleave="this.classList.remove('drag-over')"
                             ondrop="handleEditDrop(event)">
                            <i class="fas fa-plus-circle text-2xl text-gray-300 mb-1"></i>
                            <p class="text-sm font-medium text-gray-600">클릭 또는 드래그로 파일 추가</p>
                            <p class="text-xs text-gray-400 mt-0.5">PNG, JPG, GIF 지원</p>
                        </div>
                        <input type="file" id="addFiles" name="addFiles" multiple class="hidden"
                               onchange="showEditPreviews(this.files)">
                        <div id="editPreviewGrid" class="grid grid-cols-4 gap-3 mt-3 hidden"></div>
                    </div>

                    <!-- Actions -->
                    <div class="flex items-center gap-3 pt-3 border-t border-gray-100">
                        <button type="submit"
                                class="flex-1 flex items-center justify-center gap-2 px-5 py-3 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold rounded-xl shadow-sm transition-colors">
                            <i class="fas fa-check"></i>
                            수정 완료
                        </button>
                        <a th:href="@{/admin/exhibitions/{id}/productions(id=${exhibitionId})}"
                           class="px-5 py-3 border border-gray-200 text-gray-600 text-sm font-medium rounded-xl hover:bg-gray-50 transition-colors">
                            취소
                        </a>
                    </div>
                </form>
            </div>

        </main>
    </div>
</div>

<script>
    function handleEditDrop(e) {
        e.preventDefault();
        document.getElementById('editDropZone').classList.remove('drag-over');
        document.getElementById('addFiles').files = e.dataTransfer.files;
        showEditPreviews(e.dataTransfer.files);
    }

    function showEditPreviews(files) {
        var grid = document.getElementById('editPreviewGrid');
        grid.innerHTML = '';
        if (!files || files.length === 0) { grid.classList.add('hidden'); return; }
        grid.classList.remove('hidden');

        Array.from(files).forEach(function(file) {
            var wrapper = document.createElement('div');
            wrapper.className = 'relative rounded-lg overflow-hidden border border-gray-200 bg-gray-50 aspect-square';

            if (file.type.startsWith('image/')) {
                var reader = new FileReader();
                reader.onload = function(e) {
                    var img = document.createElement('img');
                    img.src = e.target.result;
                    img.className = 'w-full h-full object-cover';
                    wrapper.appendChild(img);
                };
                reader.readAsDataURL(file);
            }

            var label = document.createElement('div');
            label.className = 'absolute bottom-0 inset-x-0 bg-black/40 text-white text-xs px-1.5 py-0.5 truncate';
            label.textContent = file.name;
            wrapper.appendChild(label);

            grid.appendChild(wrapper);
        });

        document.getElementById('editDropZone').innerHTML =
            '<i class="fas fa-check-circle text-xl text-emerald-400 mb-1"></i>' +
            '<p class="text-sm font-medium text-gray-700">' + files.length + '개 파일 선택됨</p>';
    }
</script>
</body>
</html>
