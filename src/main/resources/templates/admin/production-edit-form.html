<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/layout :: head('작품 수정')}"></head>
<body class="bg-gray-50 antialiased">
<div class="flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <aside th:replace="~{admin/fragments/layout :: sidebar}"></aside>

    <!-- Main -->
    <div class="flex-1 flex flex-col min-w-0 overflow-auto">
        <div th:replace="~{admin/fragments/layout :: toast}"></div>

        <main class="flex-1 p-8">

            <!-- Breadcrumb -->
            <div class="flex items-center gap-2 text-sm text-gray-500 mb-6">
                <a href="/admin" class="hover:text-indigo-600 transition-colors">대시보드</a>
                <i class="fas fa-chevron-right text-xs text-gray-300"></i>
                <a th:href="@{/admin/exhibitions/{id}/productions(id=${exhibitionId})}"
                   class="hover:text-indigo-600 transition-colors">작품 목록</a>
                <i class="fas fa-chevron-right text-xs text-gray-300"></i>
                <span class="text-gray-700 font-medium" th:text="${productionDto.title}">작품 수정</span>
            </div>

            <!-- Form Card -->
            <div class="max-w-2xl bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden">
                <!-- Header -->
                <div class="px-8 py-6 border-b border-gray-100">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl bg-amber-50 flex items-center justify-center">
                            <i class="fas fa-pen-to-square text-amber-500"></i>
                        </div>
                        <div>
                            <h1 class="text-lg font-bold text-gray-900">작품 수정</h1>
                            <p class="text-sm text-gray-500" th:text="${productionDto.title}"></p>
                        </div>
                    </div>
                </div>

                <!-- Form Body -->
                <form id="editProductionForm"
                      th:action="@{/admin/exhibitions/{eid}/productions/{pid}/edit(eid=${exhibitionId}, pid=${productionDto.id})}"
                      th:object="${productionDto}"
                      method="post"
                      enctype="multipart/form-data"
                      class="px-8 py-6 space-y-5">

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label for="teamname" class="block text-sm font-semibold text-gray-700 mb-1.5">팀명 / 작가명</label>
                            <input type="text" id="teamname" th:field="*{teamname}"
                                   class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-shadow">
                        </div>
                        <div>
                            <label for="generation" class="block text-sm font-semibold text-gray-700 mb-1.5">기수 / 출시년도</label>
                            <input type="number" id="generation" th:field="*{generation}"
                                   class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-shadow">
                        </div>
                    </div>

                    <div>
                        <label for="title" class="block text-sm font-semibold text-gray-700 mb-1.5">작품 제목</label>
                        <input type="text" id="title" th:field="*{title}"
                               class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-shadow">
                    </div>

                    <div>
                        <label for="description" class="block text-sm font-semibold text-gray-700 mb-1.5">작품 설명</label>
                        <textarea id="description" th:field="*{description}" rows="5"
                                  class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-shadow resize-none"
                                  placeholder="작품 설명을 입력하세요. AI 도슨트에서 활용됩니다."></textarea>
                    </div>

                    <!-- Current Files -->
                    <div th:if="${!productionDto.files.isEmpty()}">
                        <label class="block text-sm font-semibold text-gray-700 mb-2">
                            현재 파일
                            <span class="text-xs font-normal text-gray-400 ml-1">삭제할 파일을 선택하세요</span>
                        </label>
                        <div class="grid grid-cols-2 gap-3">
                            <label th:each="file : *{files}"
                                   class="flex items-center gap-3 p-3 border border-gray-200 rounded-xl cursor-pointer hover:border-red-300 hover:bg-red-50 transition-colors"
                                   onclick="this.classList.toggle('border-red-400'); this.classList.toggle('bg-red-50')">
                                <input type="checkbox" name="deleteFileIds" th:value="${file.id}"
                                       class="w-4 h-4 accent-red-500 flex-shrink-0"
                                       onclick="event.stopPropagation()">
                                <img th:src="${file.path[0]}" alt="파일 미리보기"
                                     class="w-10 h-10 object-cover rounded-lg border border-gray-200 flex-shrink-0">
                                <div class="flex-1 min-w-0">
                                    <p class="text-xs font-medium text-gray-700 truncate" th:text="${file.originalFileName}"></p>
                                    <div class="flex items-center gap-1.5 mt-0.5">
                                        <span th:if="${file.type == 'ANIMATED'}"
                                              class="text-xs bg-blue-100 text-blue-600 px-1.5 py-0.5 rounded-full font-medium"
                                              th:text="${#lists.size(file.path)} + ' frames'"></span>
                                        <span th:if="${file.type == 'STATIC'}"
                                              class="text-xs bg-gray-100 text-gray-500 px-1.5 py-0.5 rounded-full font-medium">이미지</span>
                                    </div>
                                </div>
                            </label>
                        </div>
                    </div>

                    <!-- Add New Files -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1.5">작품 이미지 / 프로젝트 이미지 추가</label>
                        <div id="editDropZone"
                             class="drop-zone rounded-xl p-5 text-center cursor-pointer bg-gray-50 hover:bg-gray-100 transition-colors"
                             onclick="document.getElementById('addFiles').click()"
                             ondragover="event.preventDefault(); this.classList.add('drag-over')"
                             ondragleave="this.classList.remove('drag-over')"
                             ondrop="handleEditDrop(event)">
                            <i class="fas fa-plus-circle text-2xl text-gray-300 mb-1"></i>
                            <p class="text-sm font-medium text-gray-600">클릭 또는 드래그로 파일 추가</p>
                            <p class="text-xs text-gray-400 mt-0.5">PNG, JPG, GIF, <span class="text-indigo-400 font-medium">PDF(패널 자동 변환)</span></p>
                        </div>
                        <input type="file" id="addFiles" name="addFiles" multiple
                               accept="image/*,.pdf,application/pdf"
                               class="hidden"
                               onchange="showEditPreviews(this.files)">
                        <div id="editPreviewGrid" class="grid grid-cols-4 gap-3 mt-3 hidden"></div>
                    </div>

                    <!-- PDF Document Management -->
                    <div class="pt-1">
                        <div class="flex items-center justify-between mb-2">
                            <label class="block text-sm font-semibold text-gray-700">
                                발표 자료 / 관련 문서
                                <span class="text-xs font-normal text-gray-400 ml-1">AI 도슨트 RAG 지식</span>
                            </label>
                            <a th:href="@{/admin/rag}"
                               class="text-xs text-indigo-500 hover:text-indigo-700 transition-colors">
                                RAG 관리 페이지에서 상세 관리 →
                            </a>
                        </div>
                        <!-- 현재 문서 목록 (JS로 동적 로드) -->
                        <div id="docList" class="space-y-2 mb-3">
                            <p class="text-xs text-gray-400 italic" id="docLoadingMsg">로드 중...</p>
                        </div>
                        <!-- 새 PDF 추가 -->
                        <div id="editPdfDropZone"
                             class="rounded-xl p-4 text-center cursor-pointer border-2 border-dashed border-gray-200 hover:border-indigo-300 hover:bg-indigo-50/30 transition-colors"
                             onclick="document.getElementById('editPdfFiles').click()"
                             ondragover="event.preventDefault(); this.classList.add('border-indigo-400')"
                             ondragleave="this.classList.remove('border-indigo-400')"
                             ondrop="handleEditPdfDrop(event)">
                            <i class="fas fa-file-pdf text-xl text-gray-300 mb-1"></i>
                            <p class="text-sm font-medium text-gray-500">PDF 파일 추가</p>
                        </div>
                        <input type="file" id="editPdfFiles" multiple accept=".pdf,application/pdf" class="hidden"
                               onchange="uploadPdfFiles(this.files)">
                        <div id="editPdfUploadStatus" class="mt-2 space-y-1 hidden"></div>
                    </div>

                    <!-- Actions -->
                    <div class="flex items-center gap-3 pt-3 border-t border-gray-100">
                        <button type="submit"
                                class="flex-1 flex items-center justify-center gap-2 px-5 py-3 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold rounded-xl shadow-sm transition-colors">
                            <i class="fas fa-check"></i>
                            수정 완료
                        </button>
                        <a th:href="@{/admin/exhibitions/{id}/productions(id=${exhibitionId})}"
                           class="px-5 py-3 border border-gray-200 text-gray-600 text-sm font-medium rounded-xl hover:bg-gray-50 transition-colors">
                            취소
                        </a>
                    </div>
                </form>
            </div>

        </main>
    </div>
</div>

<script th:inline="javascript">
    var EXHIBITION_ID = /*[[${exhibitionId}]]*/ 0;
    var PRODUCTION_ID = /*[[${productionDto.id}]]*/ 0;

    // ── 이미지 드롭/프리뷰 ──
    function handleEditDrop(e) {
        e.preventDefault();
        document.getElementById('editDropZone').classList.remove('drag-over');
        document.getElementById('addFiles').files = e.dataTransfer.files;
        showEditPreviews(e.dataTransfer.files);
    }

    function showEditPreviews(files) {
        var grid = document.getElementById('editPreviewGrid');
        grid.innerHTML = '';
        if (!files || files.length === 0) { grid.classList.add('hidden'); return; }
        grid.classList.remove('hidden');

        Array.from(files).forEach(function(file) {
            var wrapper = document.createElement('div');
            wrapper.className = 'relative rounded-lg overflow-hidden border border-gray-200 bg-gray-50 aspect-square';

            if (file.type.startsWith('image/')) {
                var reader = new FileReader();
                reader.onload = function(e) {
                    var img = document.createElement('img');
                    img.src = e.target.result;
                    img.className = 'w-full h-full object-cover';
                    wrapper.appendChild(img);
                };
                reader.readAsDataURL(file);
            } else if (file.type === 'application/pdf') {
                var icon = document.createElement('div');
                icon.className = 'w-full h-full flex flex-col items-center justify-center p-2 bg-indigo-50';
                icon.innerHTML = '<i class="fas fa-file-pdf text-indigo-400 text-2xl mb-1"></i>' +
                                 '<span class="text-xs text-indigo-600 font-medium text-center leading-tight">패널 변환</span>' +
                                 '<span class="text-xs text-indigo-400 text-center break-all leading-tight mt-0.5">' + file.name + '</span>';
                wrapper.appendChild(icon);
            }

            var label = document.createElement('div');
            label.className = 'absolute bottom-0 inset-x-0 bg-black/40 text-white text-xs px-1.5 py-0.5 truncate';
            label.textContent = file.name;
            wrapper.appendChild(label);

            grid.appendChild(wrapper);
        });

        document.getElementById('editDropZone').innerHTML =
            '<i class="fas fa-check-circle text-xl text-emerald-400 mb-1"></i>' +
            '<p class="text-sm font-medium text-gray-700">' + files.length + '개 파일 선택됨</p>';
    }

    // ── PDF 문서 목록 로드 ──
    function loadDocuments() {
        var url = '/api/exhibitions/' + EXHIBITION_ID + '/productions/' + PRODUCTION_ID + '/documents';
        fetch(url)
            .then(function(r) { return r.json(); })
            .then(function(docs) {
                var list = document.getElementById('docList');
                document.getElementById('docLoadingMsg') && document.getElementById('docLoadingMsg').remove();
                list.innerHTML = '';
                if (docs.length === 0) {
                    list.innerHTML = '<p class="text-xs text-gray-400 italic">등록된 발표자료가 없습니다.</p>';
                    return;
                }
                docs.forEach(function(doc) {
                    var item = document.createElement('div');
                    item.className = 'flex items-center gap-3 px-3 py-2 bg-indigo-50 rounded-lg';
                    item.id = 'doc-' + doc.id;
                    item.innerHTML =
                        '<i class="fas fa-file-pdf text-indigo-400 flex-shrink-0"></i>' +
                        '<div class="flex-1 min-w-0">' +
                            '<p class="text-sm text-indigo-800 font-medium truncate">' + doc.originalFileName + '</p>' +
                            '<p class="text-xs text-indigo-400">' + doc.chunkCount + '개 청크 · ' + doc.createdAt + '</p>' +
                        '</div>' +
                        '<button type="button" onclick="deleteDoc(' + doc.id + ')" ' +
                            'class="flex-shrink-0 text-xs text-red-400 hover:text-red-600 transition-colors px-2 py-1 rounded-lg hover:bg-red-50">' +
                            '<i class="fas fa-trash-alt mr-1"></i>삭제</button>';
                    list.appendChild(item);
                });
            })
            .catch(function() {
                document.getElementById('docList').innerHTML =
                    '<p class="text-xs text-red-400">문서 목록을 불러오지 못했습니다.</p>';
            });
    }

    function deleteDoc(docId) {
        if (!confirm('이 발표자료를 삭제하면 해당 지식이 AI 도슨트에서 제거됩니다. 계속하시겠습니까?')) return;
        var url = '/api/exhibitions/' + EXHIBITION_ID + '/productions/' + PRODUCTION_ID + '/documents/' + docId;
        fetch(url, { method: 'DELETE' })
            .then(function(r) {
                if (r.ok) {
                    var el = document.getElementById('doc-' + docId);
                    if (el) el.remove();
                    var list = document.getElementById('docList');
                    if (list.children.length === 0) {
                        list.innerHTML = '<p class="text-xs text-gray-400 italic">등록된 발표자료가 없습니다.</p>';
                    }
                }
            });
    }

    // ── PDF 업로드 ──
    function handleEditPdfDrop(e) {
        e.preventDefault();
        e.currentTarget.classList.remove('border-indigo-400');
        document.getElementById('editPdfFiles').files = e.dataTransfer.files;
        uploadPdfFiles(e.dataTransfer.files);
    }

    function uploadPdfFiles(files) {
        if (!files || files.length === 0) return;
        var statusBox = document.getElementById('editPdfUploadStatus');
        statusBox.innerHTML = '';
        statusBox.classList.remove('hidden');

        // 파일별 상태 엘리먼트를 먼저 생성
        var fileArr = Array.from(files);
        var statusEls = fileArr.map(function(file) {
            var el = document.createElement('div');
            el.className = 'flex items-center gap-2 px-3 py-2 bg-gray-50 rounded-lg text-sm text-gray-600';
            el.innerHTML = '<i class="fas fa-spinner fa-spin text-indigo-400"></i><span class="truncate">' + file.name + ' 대기 중...</span>';
            statusBox.appendChild(el);
            return el;
        });

        var formData = new FormData();
        fileArr.forEach(function(file) { formData.append('files', file); });

        var url = '/api/exhibitions/' + EXHIBITION_ID + '/productions/' + PRODUCTION_ID + '/documents';
        fetch(url, { method: 'POST', body: formData })
            .then(function(r) {
                if (r.ok) return r.json();
                throw new Error('HTTP ' + r.status);
            })
            .then(function(docs) {
                fileArr.forEach(function(file, i) {
                    var doc = docs[i] || {};
                    statusEls[i].className = 'flex items-center gap-2 px-3 py-2 bg-emerald-50 rounded-lg text-sm text-emerald-700';
                    statusEls[i].innerHTML = '<i class="fas fa-check-circle text-emerald-400"></i><span class="truncate">'
                        + file.name + ' 인덱싱 완료' + (doc.chunkCount ? ' (' + doc.chunkCount + '개 청크)' : '') + '</span>';
                });
                loadDocuments();
            })
            .catch(function(e) {
                statusEls.forEach(function(el, i) {
                    el.className = 'flex items-center gap-2 px-3 py-2 bg-red-50 rounded-lg text-sm text-red-600';
                    el.innerHTML = '<i class="fas fa-circle-xmark text-red-400"></i><span class="truncate">' + fileArr[i].name + ' 업로드 실패</span>';
                });
            });
    }

    // 페이지 로드 시 문서 목록 조회
    document.addEventListener('DOMContentLoaded', loadDocuments);

    // ── 폼 제출 시 로딩 오버레이 ──
    document.getElementById('editProductionForm').addEventListener('submit', function() {
        document.getElementById('loadingOverlay').classList.remove('hidden');
        animateEditProgress();
    });

    function animateEditProgress() {
        var bar = document.getElementById('progressBar');
        var pct = document.getElementById('progressPct');
        var msg = document.getElementById('loadingMsg');
        var sub = document.getElementById('loadingSubMsg');
        var current = 0;

        var phases = [
            { until: 25, speed: 1.5,  label: '파일 업로드 중...', sub: '서버에 파일을 전송하고 있습니다' },
            { until: 60, speed: 0.5,  label: '이미지 처리 중...',  sub: 'GIF 프레임 분리 또는 PDF 패널 변환' },
            { until: 85, speed: 0.18, label: 'AI 인덱싱 중...',    sub: '작품 정보를 임베딩하고 있습니다' },
            { until: 92, speed: 0.07, label: '마무리 중...',        sub: '거의 완료되었습니다' }
        ];
        var phaseIdx = 0;

        var timer = setInterval(function() {
            while (phaseIdx < phases.length - 1 && current >= phases[phaseIdx].until) {
                phaseIdx++;
                msg.textContent = phases[phaseIdx].label;
                sub.textContent = phases[phaseIdx].sub;
            }
            if (current >= 92) { clearInterval(timer); return; }
            current += phases[phaseIdx].speed;
            if (current > 92) current = 92;
            bar.style.width = current + '%';
            pct.textContent = Math.floor(current) + '%';
        }, 120);
    }
</script>

<!-- 로딩 오버레이 -->
<div id="loadingOverlay"
     class="fixed inset-0 z-50 hidden flex items-center justify-center bg-white/75 backdrop-blur-sm">
    <div class="flex flex-col items-center gap-5 w-72 px-8 py-8 bg-white rounded-2xl shadow-xl border border-gray-100">
        <div class="w-14 h-14 rounded-2xl bg-indigo-50 flex items-center justify-center">
            <i class="fas fa-spinner fa-spin text-indigo-500 text-2xl"></i>
        </div>
        <div class="text-center">
            <p class="font-semibold text-gray-800 text-sm" id="loadingMsg">파일 업로드 중...</p>
            <p class="text-xs text-gray-400 mt-1" id="loadingSubMsg">잠시만 기다려 주세요</p>
        </div>
        <div class="w-full">
            <div class="flex justify-between text-xs text-gray-400 mb-1.5">
                <span>처리 중</span>
                <span id="progressPct" class="font-medium text-indigo-500">0%</span>
            </div>
            <div class="w-full h-2 bg-gray-100 rounded-full overflow-hidden">
                <div id="progressBar"
                     class="h-full bg-indigo-500 rounded-full"
                     style="width: 0%; transition: width 0.4s ease-out;"></div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
