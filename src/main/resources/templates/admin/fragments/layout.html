<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="|${title} — VEXPO Admin|">VEXPO Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0);    }
        }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.95); }
            to   { opacity: 1; transform: scale(1);    }
        }
        .toast-enter  { animation: fadeSlideUp 0.3s ease-out; }
        .modal-enter  { animation: scaleIn 0.2s ease-out;     }

        /* File drag zone */
        .drop-zone { border: 2px dashed #d1d5db; transition: all .2s; }
        .drop-zone.drag-over { border-color: #4f46e5; background: #eef2ff; }
    </style>
</head>

<body>
<!-- ===== SIDEBAR FRAGMENT ===== -->
<div th:fragment="sidebar" class="md:contents">

    <!-- ── Mobile top bar ── -->
    <header class="md:hidden fixed top-0 inset-x-0 z-30 h-14 bg-slate-900 flex items-center px-4 gap-3 border-b border-slate-800 shadow-md">
        <button type="button"
                onclick="document.getElementById('mainSidebar').classList.remove('-translate-x-full'); document.getElementById('sidebarBackdrop').classList.remove('hidden')"
                class="w-9 h-9 flex items-center justify-center rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition-colors">
            <i class="fas fa-bars"></i>
        </button>
        <a href="/admin" class="flex items-center gap-2.5">
            <div class="w-7 h-7 rounded-lg bg-indigo-600 flex items-center justify-center shadow-sm">
                <i class="fas fa-cube text-white text-xs"></i>
            </div>
            <p class="text-white font-bold tracking-tight">VEXPO</p>
        </a>
    </header>

    <!-- ── Backdrop (mobile only) ── -->
    <div id="sidebarBackdrop"
         class="fixed inset-0 z-40 bg-black/60 hidden md:hidden"
         onclick="document.getElementById('mainSidebar').classList.add('-translate-x-full'); this.classList.add('hidden')"></div>

    <!-- ── Sidebar ── -->
    <aside id="mainSidebar"
           class="fixed md:relative inset-y-0 left-0 z-50 w-72 bg-slate-900 flex flex-col flex-shrink-0 shadow-xl
                  -translate-x-full md:translate-x-0 transition-transform duration-300">

        <!-- Brand (sidebar header) -->
        <div class="h-16 flex items-center px-5 border-b border-slate-800 flex-shrink-0">
            <a href="/admin" class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center shadow-lg flex-shrink-0">
                    <i class="fas fa-cube text-white text-sm"></i>
                </div>
                <div class="leading-tight">
                    <p class="text-white font-bold text-base tracking-tight">VEXPO</p>
                    <p class="text-slate-500 text-xs">관리자 콘솔</p>
                </div>
            </a>
        </div>

        <!-- Nav -->
        <nav class="flex-1 p-3 space-y-0.5 overflow-y-auto">
            <!-- 콘텐츠 관리 -->
            <p class="text-slate-600 text-xs font-semibold uppercase tracking-widest px-3 py-2 mt-1">콘텐츠</p>
            <a href="/admin"
               class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors"
               th:classappend="${currentPage == 'dashboard'} ? ' bg-indigo-600 text-white shadow-sm' : ' text-slate-400 hover:bg-slate-800 hover:text-white'">
                <i class="fas fa-landmark w-4 text-center text-xs"></i>
                전시회 대시보드
            </a>

            <!-- AI 도슨트 -->
            <p class="text-slate-600 text-xs font-semibold uppercase tracking-widest px-3 py-2 mt-3">AI 도슨트</p>
            <a href="/admin/docent-test"
               class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors"
               th:classappend="${currentPage == 'docent-test'} ? ' bg-indigo-600 text-white shadow-sm' : ' text-slate-400 hover:bg-slate-800 hover:text-white'">
                <i class="fas fa-microphone w-4 text-center text-xs"></i>
                도슨트 테스트
            </a>
            <a href="/admin/rag"
               class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors"
               th:classappend="${currentPage == 'rag'} ? ' bg-indigo-600 text-white shadow-sm' : ' text-slate-400 hover:bg-slate-800 hover:text-white'">
                <i class="fas fa-brain w-4 text-center text-xs"></i>
                RAG 관리
            </a>
        </nav>

        <div class="p-4 border-t border-slate-800 flex-shrink-0">
            <p class="text-slate-600 text-xs text-center">VEXPO © 2025</p>
        </div>
    </aside>
</div>

<!-- ===== TOAST ===== -->
<div th:fragment="toast">
    <div th:if="${successMessage}" id="toastSuccess"
         class="toast-enter fixed bottom-5 right-5 z-50 flex items-center gap-3 bg-emerald-500 text-white pl-4 pr-3 py-3 rounded-xl shadow-xl max-w-sm">
        <i class="fas fa-circle-check text-lg flex-shrink-0"></i>
        <span class="text-sm font-medium flex-1" th:text="${successMessage}"></span>
        <button onclick="this.closest('div').remove()"
                class="opacity-60 hover:opacity-100 transition-opacity w-6 h-6 flex items-center justify-center rounded flex-shrink-0">
            <i class="fas fa-xmark text-sm"></i>
        </button>
    </div>
    <div th:if="${errorMessage}" id="toastError"
         class="toast-enter fixed bottom-5 right-5 z-50 flex items-center gap-3 bg-red-500 text-white pl-4 pr-3 py-3 rounded-xl shadow-xl max-w-sm">
        <i class="fas fa-circle-exclamation text-lg flex-shrink-0"></i>
        <span class="text-sm font-medium flex-1" th:text="${errorMessage}"></span>
        <button onclick="this.closest('div').remove()"
                class="opacity-60 hover:opacity-100 transition-opacity w-6 h-6 flex items-center justify-center rounded flex-shrink-0">
            <i class="fas fa-xmark text-sm"></i>
        </button>
    </div>
    <script>
        (function() {
            ['toastSuccess', 'toastError'].forEach(function(id) {
                var el = document.getElementById(id);
                if (!el) return;
                setTimeout(function() {
                    el.style.transition = 'opacity 0.4s';
                    el.style.opacity = '0';
                    setTimeout(function() { if (el.parentNode) el.remove(); }, 400);
                }, 4500);
            });
        })();
    </script>
</div>

<!-- ===== DELETE MODAL ===== -->
<div th:fragment="deleteModal">
    <div id="deleteModal"
         onclick="if(event.target===this)closeDeleteModal()"
         style="display:none"
         class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="modal-enter bg-white rounded-2xl shadow-2xl w-full max-w-sm">
            <div class="p-6">
                <div class="flex items-start gap-4">
                    <div class="flex-shrink-0 w-11 h-11 rounded-full bg-red-100 flex items-center justify-center">
                        <i class="fas fa-trash-alt text-red-500"></i>
                    </div>
                    <div class="flex-1 min-w-0 pt-0.5">
                        <h3 class="font-semibold text-gray-900 text-base" id="deleteModalTitle">삭제 확인</h3>
                        <p class="text-gray-500 text-sm mt-1 leading-relaxed" id="deleteModalMessage">삭제하시겠습니까?</p>
                    </div>
                </div>
                <div class="flex gap-3 mt-5">
                    <button onclick="closeDeleteModal()"
                            class="flex-1 px-4 py-2.5 border border-gray-200 text-gray-600 text-sm font-medium rounded-xl hover:bg-gray-50 transition-colors cursor-pointer">
                        취소
                    </button>
                    <a id="deleteConfirmLink" href="#"
                       class="flex-1 px-4 py-2.5 bg-red-500 hover:bg-red-600 text-white text-sm font-semibold text-center rounded-xl transition-colors">
                        삭제하기
                    </a>
                </div>
            </div>
        </div>
    </div>
    <script>
        function showDeleteModal(title, msg, href) {
            document.getElementById('deleteModalTitle').textContent = title;
            document.getElementById('deleteModalMessage').textContent = msg;
            document.getElementById('deleteConfirmLink').href = href;
            document.getElementById('deleteModal').style.display = 'flex';
        }
        function closeDeleteModal() {
            document.getElementById('deleteModal').style.display = 'none';
        }
    </script>
</div>
</body>
</html>
