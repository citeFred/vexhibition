<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/layout :: head('작품 관리')}"></head>
<body class="bg-gray-50 antialiased">
<div class="flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <div th:replace="~{admin/fragments/layout :: sidebar}"></div>

    <!-- Main -->
    <div class="flex-1 flex flex-col min-w-0 overflow-auto pt-14 md:pt-0">
        <div th:replace="~{admin/fragments/layout :: toast}"></div>

        <main class="flex-1 p-4 sm:p-8">

            <!-- Page Header -->
            <div class="flex items-start sm:items-center justify-between mb-6 sm:mb-8 gap-3">
                <div>
                    <!-- Breadcrumb -->
                    <div class="flex items-center gap-2 text-sm text-gray-500 mb-1.5">
                        <a href="/admin" class="hover:text-indigo-600 transition-colors">대시보드</a>
                        <i class="fas fa-chevron-right text-xs text-gray-300"></i>
                        <span class="text-gray-700 font-medium truncate max-w-[140px] sm:max-w-none"
                              th:text="${exhibition.title}">전시회명</span>
                    </div>
                    <h1 class="text-xl sm:text-2xl font-bold text-gray-900">작품 관리</h1>
                    <p class="text-gray-500 text-sm mt-0.5 hidden sm:block"
                       th:text="${#lists.size(productions)} + '개 작품이 등록되어 있습니다.'"></p>
                </div>
                <a th:href="@{/admin/exhibitions/{id}/productions/new(id=${exhibition.id})}"
                   class="inline-flex items-center gap-2 px-3 sm:px-4 py-2 sm:py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold rounded-xl shadow-sm transition-colors flex-shrink-0">
                    <i class="fas fa-plus text-xs"></i>
                    <span class="hidden sm:inline">새 작품 추가</span>
                    <span class="sm:hidden">추가</span>
                </a>
            </div>

            <!-- Table Card -->
            <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
                <!-- Empty State -->
                <div th:if="${productions.isEmpty()}" class="flex flex-col items-center py-16 text-center px-4">
                    <div class="w-16 h-16 rounded-2xl bg-gray-100 flex items-center justify-center mb-4">
                        <i class="fas fa-palette text-2xl text-gray-400"></i>
                    </div>
                    <p class="text-gray-700 font-medium">등록된 작품이 없습니다</p>
                    <p class="text-gray-400 text-sm mt-1 mb-5">이 전시회에 첫 작품을 추가해보세요.</p>
                    <a th:href="@{/admin/exhibitions/{id}/productions/new(id=${exhibition.id})}"
                       class="inline-flex items-center gap-2 px-4 py-2 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700 transition-colors">
                        <i class="fas fa-plus text-xs"></i> 새 작품 추가
                    </a>
                </div>

                <!-- Mobile card list (sm 미만) -->
                <div th:unless="${productions.isEmpty()}" class="sm:hidden divide-y divide-gray-100">
                    <div th:each="production : ${productions}"
                         class="flex items-center gap-3 p-4">
                        <!-- Thumbnail -->
                        <div th:if="${!production.files.isEmpty()}" class="flex-shrink-0">
                            <img th:src="${production.files[0].path[0]}" alt="thumbnail"
                                 class="w-14 h-14 rounded-xl object-cover border border-gray-200 shadow-sm">
                        </div>
                        <div th:if="${production.files.isEmpty()}"
                             class="flex-shrink-0 w-14 h-14 rounded-xl bg-gray-100 flex items-center justify-center">
                            <i class="fas fa-image text-gray-300"></i>
                        </div>
                        <!-- Info -->
                        <div class="flex-1 min-w-0">
                            <p class="font-semibold text-gray-900 text-sm truncate" th:text="${production.title}"></p>
                            <p class="text-xs text-gray-500 mt-0.5" th:text="${production.teamname}"></p>
                            <div class="flex items-center gap-2 mt-1">
                                <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-semibold bg-violet-100 text-violet-700"
                                      th:text="${production.generation} + '기'"></span>
                                <span class="text-xs text-gray-400"
                                      th:text="${#temporals.format(production.createAt, 'MM-dd')}"></span>
                            </div>
                        </div>
                        <!-- Actions -->
                        <div class="flex flex-col gap-2 flex-shrink-0">
                            <a th:href="@{/admin/exhibitions/{eid}/productions/{pid}/edit(eid=${exhibition.id}, pid=${production.id})}"
                               class="flex items-center justify-center w-9 h-9 rounded-lg bg-indigo-50 text-indigo-600 hover:bg-indigo-100 transition-colors">
                                <i class="fas fa-pen-to-square text-sm"></i>
                            </a>
                            <button type="button"
                                    th:data-title="${production.title}"
                                    th:data-href="@{/admin/exhibitions/{eid}/productions/{pid}/delete(eid=${exhibition.id}, pid=${production.id})}"
                                    onclick="var t=this.dataset.title; showDeleteModal('작품 삭제', '「'+t+'」 작품을 삭제합니다. 관련 파일도 함께 삭제됩니다.', this.dataset.href)"
                                    class="flex items-center justify-center w-9 h-9 rounded-lg bg-gray-100 text-gray-400 hover:bg-red-50 hover:text-red-500 transition-colors cursor-pointer">
                                <i class="fas fa-trash-alt text-sm"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Desktop Table (sm 이상) -->
                <div th:unless="${productions.isEmpty()}" class="hidden sm:block overflow-x-auto">
                    <table class="w-full">
                        <thead>
                        <tr class="bg-gray-50 border-b border-gray-200">
                            <th class="px-5 py-3.5 text-left text-xs font-semibold text-gray-500 uppercase tracking-wide">미리보기</th>
                            <th class="px-5 py-3.5 text-left text-xs font-semibold text-gray-500 uppercase tracking-wide">작품 정보</th>
                            <th class="px-5 py-3.5 text-left text-xs font-semibold text-gray-500 uppercase tracking-wide">팀명</th>
                            <th class="px-5 py-3.5 text-left text-xs font-semibold text-gray-500 uppercase tracking-wide">기수</th>
                            <th class="px-5 py-3.5 text-left text-xs font-semibold text-gray-500 uppercase tracking-wide">파일</th>
                            <th class="px-5 py-3.5 text-left text-xs font-semibold text-gray-500 uppercase tracking-wide">등록일</th>
                            <th class="px-5 py-3.5 text-right text-xs font-semibold text-gray-500 uppercase tracking-wide">관리</th>
                        </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-100">
                        <tr th:each="production : ${productions}"
                            class="hover:bg-gray-50 transition-colors">
                            <td class="px-5 py-3">
                                <div th:if="${!production.files.isEmpty()}">
                                    <img th:src="${production.files[0].path[0]}" alt="thumbnail"
                                         class="w-12 h-12 rounded-lg object-cover border border-gray-200 shadow-sm">
                                </div>
                                <div th:if="${production.files.isEmpty()}"
                                     class="w-12 h-12 rounded-lg bg-gray-100 flex items-center justify-center">
                                    <i class="fas fa-image text-gray-300 text-sm"></i>
                                </div>
                            </td>
                            <td class="px-5 py-3">
                                <p class="font-medium text-gray-900 text-sm" th:text="${production.title}"></p>
                                <p class="text-xs text-gray-400 mt-0.5">ID <span th:text="${production.id}"></span></p>
                            </td>
                            <td class="px-5 py-3">
                                <span class="text-sm text-gray-700" th:text="${production.teamname}"></span>
                            </td>
                            <td class="px-5 py-3">
                                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-violet-100 text-violet-700"
                                      th:text="${production.generation} + '기'"></span>
                            </td>
                            <td class="px-5 py-3">
                                <span class="inline-flex items-center gap-1 text-xs font-medium text-gray-600">
                                    <i class="fas fa-file-image text-gray-400"></i>
                                    <span th:text="${#lists.size(production.files)}">0</span>개
                                </span>
                            </td>
                            <td class="px-5 py-3">
                                <span class="text-xs text-gray-500"
                                      th:text="${#temporals.format(production.createAt, 'yyyy-MM-dd')}"></span>
                            </td>
                            <td class="px-5 py-3">
                                <div class="flex items-center justify-end gap-3">
                                    <a th:href="@{/admin/exhibitions/{eid}/productions/{pid}/edit(eid=${exhibition.id}, pid=${production.id})}"
                                       class="text-xs font-semibold text-indigo-600 hover:text-indigo-800 transition-colors">
                                        <i class="fas fa-pen-to-square mr-1"></i>수정
                                    </a>
                                    <button type="button"
                                            th:data-title="${production.title}"
                                            th:data-href="@{/admin/exhibitions/{eid}/productions/{pid}/delete(eid=${exhibition.id}, pid=${production.id})}"
                                            onclick="var t=this.dataset.title; showDeleteModal('작품 삭제', '「'+t+'」 작품을 삭제합니다. 관련 파일도 함께 삭제됩니다.', this.dataset.href)"
                                            class="text-xs font-semibold text-gray-400 hover:text-red-500 transition-colors cursor-pointer">
                                        <i class="fas fa-trash-alt mr-1"></i>삭제
                                    </button>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>
</div>

<div th:replace="~{admin/fragments/layout :: deleteModal}"></div>
</body>
</html>
