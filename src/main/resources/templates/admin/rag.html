<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/layout :: head('RAG 관리')}"></head>
<body class="bg-gray-50 antialiased">
<div class="flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <div th:replace="~{admin/fragments/layout :: sidebar}"></div>

    <!-- Main -->
    <div class="flex-1 flex flex-col min-w-0 overflow-auto pt-14 md:pt-0">
        <div th:replace="~{admin/fragments/layout :: toast}"></div>

        <main class="flex-1 p-4 sm:p-8">

            <!-- Page Header -->
            <div class="mb-8">
                <h1 class="text-2xl font-bold text-gray-900">RAG 관리</h1>
                <p class="text-gray-500 text-sm mt-0.5">AI 도슨트를 위한 임베딩 인덱스를 관리합니다.</p>
            </div>

            <!-- Status Cards -->
            <div class="grid grid-cols-2 gap-5 mb-8">
                <div class="bg-white rounded-xl border border-gray-200 p-5 shadow-sm">
                    <div class="flex items-center justify-between mb-3">
                        <p class="text-sm font-medium text-gray-500">작품 인덱스</p>
                        <div class="w-9 h-9 rounded-lg bg-indigo-50 flex items-center justify-center">
                            <i class="fas fa-database text-indigo-500 text-sm"></i>
                        </div>
                    </div>
                    <p class="text-3xl font-bold text-gray-900" th:text="${totalProductions}">0</p>
                    <p class="text-xs text-gray-400 mt-1">등록된 작품 (인덱싱 대상)</p>
                </div>
                <div class="bg-white rounded-xl border border-gray-200 p-5 shadow-sm" id="docStatusCard">
                    <div class="flex items-center justify-between mb-3">
                        <p class="text-sm font-medium text-gray-500">문서 인덱스 현황</p>
                        <div class="w-9 h-9 rounded-lg bg-emerald-50 flex items-center justify-center">
                            <i class="fas fa-file-lines text-emerald-500 text-sm"></i>
                        </div>
                    </div>
                    <p class="text-sm font-medium text-gray-700" id="docStatusText">
                        <span class="text-gray-400 italic text-xs">조회하려면 아래 버튼을 누르세요</span>
                    </p>
                </div>
            </div>

            <!-- Action Panels -->
            <div class="grid grid-cols-2 gap-5 mb-6">
                <!-- Batch Index -->
                <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
                    <div class="px-6 py-5 border-b border-gray-100">
                        <div class="flex items-center gap-3">
                            <div class="w-9 h-9 rounded-lg bg-indigo-50 flex items-center justify-center flex-shrink-0">
                                <i class="fas fa-bolt text-indigo-500 text-sm"></i>
                            </div>
                            <div>
                                <h2 class="font-semibold text-gray-900 text-sm">전체 작품 일괄 인덱싱</h2>
                                <p class="text-xs text-gray-500 mt-0.5">모든 작품 description을 임베딩하여 pgvector에 저장합니다.</p>
                            </div>
                        </div>
                    </div>
                    <div class="px-6 py-4 flex items-center gap-3">
                        <button onclick="indexAll()"
                                class="flex items-center gap-2 px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold rounded-xl transition-colors">
                            <i class="fas fa-play text-xs"></i>
                            일괄 인덱싱 실행
                        </button>
                        <button onclick="getDocStatus()"
                                class="flex items-center gap-2 px-4 py-2.5 border border-gray-200 text-gray-600 hover:bg-gray-50 text-sm font-medium rounded-xl transition-colors">
                            <i class="fas fa-arrow-rotate-right text-xs"></i>
                            인덱스 현황 조회
                        </button>
                    </div>
                </div>

                <!-- Log Panel -->
                <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
                    <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between">
                        <h2 class="font-semibold text-gray-900 text-sm">작업 로그</h2>
                        <button onclick="clearLog()" class="text-xs text-gray-400 hover:text-gray-600 transition-colors">초기화</button>
                    </div>
                    <div id="logArea"
                         class="px-5 py-4 font-mono text-xs text-gray-600 space-y-1 min-h-[120px] max-h-60 overflow-auto bg-slate-950 text-slate-300">
                        <p class="text-slate-500 italic">작업을 실행하면 여기에 로그가 표시됩니다.</p>
                    </div>
                </div>
            </div>

            <!-- Per-Exhibition Index -->
            <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
                <div class="px-6 py-5 border-b border-gray-100">
                    <h2 class="font-semibold text-gray-900">전시회별 작품 관리</h2>
                    <p class="text-sm text-gray-500 mt-0.5">작품 description 인덱싱과 발표 자료(PDF) 지식을 관리합니다.</p>
                </div>

                <!-- Exhibition Accordion -->
                <div class="divide-y divide-gray-100">
                    <div th:each="exhibition : ${exhibitions}" class="group">
                        <!-- Exhibition Header -->
                        <button type="button"
                                th:data-id="${exhibition.id}"
                                onclick="toggleExhibition(this)"
                                class="w-full flex items-center justify-between px-6 py-4 hover:bg-gray-50 transition-colors text-left">
                            <div class="flex items-center gap-3">
                                <div class="w-8 h-8 rounded-lg bg-indigo-50 flex items-center justify-center flex-shrink-0">
                                    <i class="fas fa-landmark text-indigo-400 text-xs"></i>
                                </div>
                                <div>
                                    <p class="font-medium text-gray-900 text-sm" th:text="${exhibition.title}"></p>
                                    <p class="text-xs text-gray-400"
                                       th:text="${#lists.size(exhibition.productions)} + '개 작품'"></p>
                                </div>
                            </div>
                            <i class="fas fa-chevron-down text-gray-400 text-xs transition-transform duration-200 chevron-icon"></i>
                        </button>

                        <!-- Productions List -->
                        <div class="hidden production-panel px-6 pb-5 pt-2">
                            <div th:if="${exhibition.productions.isEmpty()}"
                                 class="py-4 text-center text-sm text-gray-400">
                                이 전시회에 등록된 작품이 없습니다.
                            </div>
                            <div th:unless="${exhibition.productions.isEmpty()}" class="space-y-3">
                                <div th:each="production : ${exhibition.productions}"
                                     th:data-exhibition-id="${exhibition.id}"
                                     th:data-production-id="${production.id}"
                                     class="border border-gray-200 rounded-xl overflow-hidden">

                                    <!-- 작품 헤더 행 -->
                                    <div class="flex items-center justify-between py-3 px-4 bg-gray-50">
                                        <div>
                                            <p class="text-sm font-semibold text-gray-800" th:text="${production.title}"></p>
                                            <p class="text-xs text-gray-500"
                                               th:text="${production.teamname} + ' · ' + ${production.generation} + '기'"></p>
                                        </div>
                                        <!-- Description 인덱싱 버튼 -->
                                        <div class="flex items-center gap-2">
                                            <button type="button"
                                                    th:data-id="${production.id}"
                                                    th:data-title="${production.title}"
                                                    onclick="indexOne(this.dataset.id, this.dataset.title)"
                                                    class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-lg transition-colors"
                                                    title="설명 텍스트 인덱싱">
                                                <i class="fas fa-upload text-xs"></i>
                                                설명 인덱싱
                                            </button>
                                            <button type="button"
                                                    th:data-id="${production.id}"
                                                    th:data-title="${production.title}"
                                                    onclick="deleteIndex(this.dataset.id, this.dataset.title)"
                                                    class="inline-flex items-center gap-1.5 px-3 py-1.5 border border-gray-200 text-gray-500 hover:text-red-500 hover:border-red-300 text-xs font-medium rounded-lg transition-colors"
                                                    title="설명 인덱스 삭제">
                                                <i class="fas fa-trash-alt text-xs"></i>
                                                설명 삭제
                                            </button>
                                        </div>
                                    </div>

                                    <!-- PDF 문서 섹션 -->
                                    <div class="px-4 py-3 bg-white">
                                        <div class="flex items-center justify-between mb-2">
                                            <p class="text-xs font-semibold text-gray-500 uppercase tracking-wide">
                                                <i class="fas fa-file-pdf text-indigo-400 mr-1"></i>발표 자료 / 지식 문서
                                            </p>
                                            <label th:for="'pdf-upload-' + ${production.id}"
                                                   class="inline-flex items-center gap-1.5 px-3 py-1 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-xs font-semibold rounded-lg cursor-pointer transition-colors">
                                                <i class="fas fa-plus text-xs"></i>
                                                PDF 추가
                                            </label>
                                            <input type="file"
                                                   th:id="'pdf-upload-' + ${production.id}"
                                                   multiple accept=".pdf,application/pdf"
                                                   class="hidden"
                                                   th:data-exhibition-id="${exhibition.id}"
                                                   th:data-production-id="${production.id}"
                                                   onchange="handlePdfUpload(this)">
                                        </div>
                                        <!-- 문서 목록 (JS로 동적 로드) -->
                                        <div th:id="'doc-list-' + ${production.id}"
                                             class="space-y-1.5 min-h-[28px]">
                                            <p class="text-xs text-gray-400 italic">로드 중...</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </main>
    </div>
</div>

<script>
    // ── Accordion ──
    function toggleExhibition(btn) {
        var panel = btn.nextElementSibling;
        var icon  = btn.querySelector('.chevron-icon');
        var isOpening = panel.classList.contains('hidden');
        panel.classList.toggle('hidden');
        icon.style.transform = isOpening ? 'rotate(180deg)' : '';

        // 패널을 열 때 각 작품의 PDF 문서 목록 로드
        if (isOpening) {
            panel.querySelectorAll('[data-production-id]').forEach(function(card) {
                loadDocs(card.dataset.exhibitionId, card.dataset.productionId);
            });
        }
    }

    // ── Log ──
    function addLog(msg, type) {
        var area = document.getElementById('logArea');
        var p = document.createElement('p');
        var time = new Date().toLocaleTimeString('ko-KR');
        var color = type === 'success' ? 'text-emerald-400' : type === 'error' ? 'text-red-400' : 'text-slate-300';
        p.className = color;
        p.textContent = '[' + time + '] ' + msg;
        area.appendChild(p);
        area.scrollTop = area.scrollHeight;
        var placeholder = area.querySelector('.italic');
        if (placeholder) placeholder.remove();
    }
    function clearLog() {
        document.getElementById('logArea').innerHTML =
            '<p class="text-slate-500 italic">작업을 실행하면 여기에 로그가 표시됩니다.</p>';
    }

    // ── Description 인덱싱 ──
    function indexAll() {
        addLog('전체 작품 일괄 인덱싱 시작...', 'info');
        fetch('/admin/api/rag/index/descriptions', { method: 'POST' })
            .then(function(r) { return r.text(); })
            .then(function(t) { addLog('완료: ' + t, 'success'); })
            .catch(function(e) { addLog('오류: ' + e, 'error'); });
    }

    function indexOne(id, title) {
        addLog('설명 인덱싱: ' + title + ' (ID: ' + id + ')', 'info');
        fetch('/admin/api/rag/index/productions/' + id + '/description', { method: 'POST' })
            .then(function(r) { return r.text(); })
            .then(function(t) { addLog('완료: ' + t, 'success'); })
            .catch(function(e) { addLog('오류: ' + e, 'error'); });
    }

    function deleteIndex(id, title) {
        if (!confirm('「' + title + '」의 설명 인덱스를 삭제하시겠습니까?')) return;
        addLog('설명 인덱스 삭제: ' + title, 'info');
        fetch('/admin/api/rag/index/productions/' + id + '/description', { method: 'DELETE' })
            .then(function(r) { return r.text(); })
            .then(function(t) { addLog('삭제 완료: ' + t, 'success'); })
            .catch(function(e) { addLog('오류: ' + e, 'error'); });
    }

    function getDocStatus() {
        fetch('/admin/api/rag/index/documents')
            .then(function(r) { return r.text(); })
            .then(function(t) {
                document.getElementById('docStatusText').textContent = t;
                addLog('인덱스 현황: ' + t, 'success');
            })
            .catch(function(e) { addLog('현황 조회 오류: ' + e, 'error'); });
    }

    // ── PDF 문서 목록 로드 ──
    function loadDocs(exhibitionId, productionId) {
        var listEl = document.getElementById('doc-list-' + productionId);
        if (!listEl) return;

        fetch('/api/exhibitions/' + exhibitionId + '/productions/' + productionId + '/documents')
            .then(function(r) { return r.json(); })
            .then(function(docs) {
                renderDocList(listEl, exhibitionId, productionId, docs);
            })
            .catch(function() {
                listEl.innerHTML = '<p class="text-xs text-red-400">문서 목록 조회 실패</p>';
            });
    }

    function renderDocList(listEl, exhibitionId, productionId, docs) {
        listEl.innerHTML = '';
        if (docs.length === 0) {
            listEl.innerHTML = '<p class="text-xs text-gray-400 italic">등록된 발표자료가 없습니다.</p>';
            return;
        }
        docs.forEach(function(doc) {
            var item = document.createElement('div');
            item.className = 'flex items-center gap-2 px-3 py-2 bg-indigo-50 rounded-lg';
            item.id = 'rag-doc-' + doc.id;
            item.innerHTML =
                '<i class="fas fa-file-pdf text-indigo-400 flex-shrink-0 text-xs"></i>' +
                '<div class="flex-1 min-w-0">' +
                    '<p class="text-xs font-medium text-indigo-800 truncate">' + doc.originalFileName + '</p>' +
                    '<p class="text-xs text-indigo-400">' + doc.chunkCount + '개 청크</p>' +
                '</div>' +
                '<button type="button" ' +
                    'onclick="deleteDoc(\'' + exhibitionId + '\',\'' + productionId + '\',' + doc.id + ',\'' + doc.originalFileName + '\')" ' +
                    'class="flex-shrink-0 text-xs text-gray-400 hover:text-red-500 transition-colors px-2 py-1 rounded hover:bg-red-50">' +
                    '<i class="fas fa-trash-alt"></i></button>';
            listEl.appendChild(item);
        });
    }

    // ── PDF 문서 삭제 ──
    function deleteDoc(exhibitionId, productionId, docId, fileName) {
        if (!confirm('「' + fileName + '」를 삭제하면 해당 지식이 AI 도슨트에서 제거됩니다. 계속하시겠습니까?')) return;
        addLog('PDF 삭제 중: ' + fileName, 'info');
        fetch('/api/exhibitions/' + exhibitionId + '/productions/' + productionId + '/documents/' + docId,
              { method: 'DELETE' })
            .then(function(r) {
                if (r.ok) {
                    var el = document.getElementById('rag-doc-' + docId);
                    if (el) el.remove();
                    var listEl = document.getElementById('doc-list-' + productionId);
                    if (listEl && listEl.children.length === 0) {
                        listEl.innerHTML = '<p class="text-xs text-gray-400 italic">등록된 발표자료가 없습니다.</p>';
                    }
                    addLog('삭제 완료: ' + fileName, 'success');
                    getDocStatus();
                }
            })
            .catch(function(e) { addLog('삭제 오류: ' + e, 'error'); });
    }

    // ── PDF 업로드 ──
    function handlePdfUpload(input) {
        var exhibitionId = input.dataset.exhibitionId;
        var productionId = input.dataset.productionId;
        if (!input.files || input.files.length === 0) return;

        var fileArr = Array.from(input.files);
        fileArr.forEach(function(file) { addLog('업로드 대기: ' + file.name, 'info'); });

        var formData = new FormData();
        fileArr.forEach(function(file) { formData.append('files', file); });

        fetch('/api/exhibitions/' + exhibitionId + '/productions/' + productionId + '/documents',
              { method: 'POST', body: formData })
            .then(function(r) {
                if (r.ok) return r.json();
                throw new Error('업로드 실패 (HTTP ' + r.status + ')');
            })
            .then(function(docs) {
                docs.forEach(function(doc) {
                    addLog('인덱싱 완료: ' + doc.originalFileName + ' (' + doc.chunkCount + '개 청크)', 'success');
                });
                loadDocs(exhibitionId, productionId);
                getDocStatus();
            })
            .catch(function(e) { addLog('오류: ' + e.message, 'error'); });

        // 같은 파일 재선택 허용
        input.value = '';
    }
</script>
</body>
</html>
