<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/layout :: head('전시회 수정')}"></head>
<body class="bg-gray-50 antialiased">
<div class="flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <div th:replace="~{admin/fragments/layout :: sidebar}"></div>

    <!-- Main -->
    <div class="flex-1 flex flex-col min-w-0 overflow-auto pt-14 md:pt-0">
        <div th:replace="~{admin/fragments/layout :: toast}"></div>

        <main class="flex-1 p-4 sm:p-8">

            <!-- Breadcrumb -->
            <div class="flex items-center gap-2 text-sm text-gray-500 mb-6">
                <a href="/admin" class="hover:text-indigo-600 transition-colors">대시보드</a>
                <i class="fas fa-chevron-right text-xs text-gray-300"></i>
                <span class="text-gray-700 font-medium">전시회 수정</span>
            </div>

            <!-- Form Card -->
            <div class="max-w-lg bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden">
                <!-- Header -->
                <div class="px-6 sm:px-8 py-5 sm:py-6 border-b border-gray-100">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl bg-amber-50 flex items-center justify-center">
                            <i class="fas fa-pen-to-square text-amber-500"></i>
                        </div>
                        <div>
                            <h1 class="text-lg font-bold text-gray-900">전시회 수정</h1>
                            <p class="text-sm text-gray-500">전시회 정보를 수정하세요.</p>
                        </div>
                    </div>
                </div>

                <!-- Form Body -->
                <form th:action="@{/admin/exhibitions/{id}/edit(id=${exhibitionId})}"
                      th:object="${exhibitionRequestDto}"
                      method="post"
                      class="px-6 sm:px-8 py-5 sm:py-6">
                    <div class="mb-6">
                        <label for="title" class="block text-sm font-semibold text-gray-700 mb-2">
                            전시회 제목 <span class="text-red-500">*</span>
                        </label>
                        <input type="text" id="title" th:field="*{title}"
                               class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-shadow"
                               placeholder="예: 메타버스 아카데미 5기 수료작품 전시회"
                               required>
                    </div>

                    <div class="flex items-center gap-3 pt-2">
                        <button type="submit"
                                class="flex-1 flex items-center justify-center gap-2 px-5 py-3 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold rounded-xl shadow-sm transition-colors">
                            <i class="fas fa-check"></i>
                            수정 완료
                        </button>
                        <a th:href="@{/admin}"
                           class="px-5 py-3 border border-gray-200 text-gray-600 text-sm font-medium rounded-xl hover:bg-gray-50 transition-colors">
                            취소
                        </a>
                    </div>
                </form>
            </div>

        </main>
    </div>
</div>
</body>
</html>
