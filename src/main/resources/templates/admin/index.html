<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>VEXPO 전시회 관리</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-gray-100">

<div class="container mx-auto mt-10 px-4">
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8">
        <div>
            <h1 class="text-3xl font-bold text-gray-800">VEXPO 전시회 관리</h1>
            <p class="text-gray-500 mt-1">전시회를 선택하여 작품을 관리하세요.</p>
        </div>
        <a th:href="@{/admin/exhibitions/new}"
           class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg shadow-md transition-transform transform hover:scale-105 mt-4 sm:mt-0">
            <i class="fas fa-plus mr-2"></i>새 전시회 추가
        </a>
    </div>

    <!-- 전시회 목록을 카드로 표시하는 영역 -->
    <div class="bg-white shadow-md rounded-lg p-6">
        <h2 class="text-2xl font-semibold mb-6 text-gray-700">전시회 목록</h2>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">

            <!-- th:each를 사용하여 exhibitions 리스트를 반복하여 카드를 생성 -->
            <div th:each="exhibition : ${exhibitions}" class="bg-white rounded-lg shadow-lg overflow-hidden transform hover:-translate-y-1 transition-transform duration-300 border border-gray-200 flex flex-col">
                <!-- [수정] 카드 내용 부분에 최소 높이를 지정하여 디자인 일관성 유지 -->
                <div class="p-6 flex-grow min-h-[11rem]">
                    <div class="flex items-start mb-4">
                        <i class="fas fa-landmark text-2xl text-blue-500 mr-3 mt-1"></i>
                        <!-- [수정] h3 태그에서 truncate 클래스 제거하고 break-words 추가 -->
                        <h3 class="font-bold text-xl text-gray-800 break-words" th:text="${exhibition.title}">메타버스 아카데미 5기 수료작품 전시회</h3>
                    </div>
                    <p class="text-sm text-gray-500">
                        <span class="font-semibold">ID:</span>
                        <span th:text="${exhibition.id}">1</span>
                    </p>
                    <p class="text-sm text-gray-500 mt-1">
                        <span class="font-semibold">생성일:</span>
                        <span th:text="${#temporals.format(exhibition.createAt, 'yyyy-MM-dd HH:mm')}">2025-08-10</span>
                    </p>
                </div>

                <!-- 카드 하단의 관리 버튼 영역 -->
                <div class="px-6 py-4 bg-gray-50 border-t border-gray-200 flex justify-between items-center">
                    <a th:href="@{/admin/exhibitions/{id}/productions(id=${exhibition.id})}"
                       class="text-sm font-semibold text-indigo-600 hover:text-indigo-800 transition-colors">
                        <i class="fas fa-tasks mr-1"></i>작품 관리
                    </a>
                    <a th:href="@{/admin/exhibitions/{id}/delete(id=${exhibition.id})}"
                       onclick="return confirm('정말로 이 전시회를 삭제하시겠습니까? 전시회에 속한 모든 작품과 파일이 영구적으로 삭제됩니다.')"
                       class="text-sm font-semibold text-red-600 hover:text-red-800 transition-colors">
                        <i class="fas fa-trash-alt mr-1"></i>삭제
                    </a>
                </div>
            </div>

            <!-- 만약 전시회가 없다면 표시할 메시지 -->
            <div th:if="${exhibitions.isEmpty()}" class="col-span-full flex flex-col items-center justify-center p-10 bg-gray-50 rounded-lg">
                <i class="fas fa-folder-open text-4xl text-gray-400 mb-4"></i>
                <p class="text-center text-gray-500">생성된 전시회가 없습니다.</p>
                <p class="text-center text-gray-400 text-sm mt-1">'새 전시회 추가' 버튼을 눌러 시작해보세요.</p>
            </div>
        </div>
    </div>
</div>

</body>
</html>
