<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/layout :: head('대시보드')}"></head>
<body class="bg-gray-50 antialiased">
<div class="flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <aside th:replace="~{admin/fragments/layout :: sidebar}"></aside>

    <!-- Main -->
    <div class="flex-1 flex flex-col min-w-0 overflow-auto">
        <div th:replace="~{admin/fragments/layout :: toast}"></div>

        <main class="flex-1 p-8">

            <!-- Page Header -->
            <div class="flex items-center justify-between mb-8">
                <div>
                    <h1 class="text-2xl font-bold text-gray-900">전시회 대시보드</h1>
                    <p class="text-gray-500 text-sm mt-0.5">전시회와 작품을 한눈에 관리하세요.</p>
                </div>
                <a th:href="@{/admin/exhibitions/new}"
                   class="inline-flex items-center gap-2 px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold rounded-xl shadow-sm transition-colors">
                    <i class="fas fa-plus text-xs"></i>
                    새 전시회 추가
                </a>
            </div>

            <!-- Stats -->
            <div class="grid grid-cols-3 gap-5 mb-8">
                <div class="bg-white rounded-xl border border-gray-200 p-5 shadow-sm">
                    <div class="flex items-center justify-between mb-3">
                        <p class="text-sm font-medium text-gray-500">전시회</p>
                        <div class="w-9 h-9 rounded-lg bg-indigo-50 flex items-center justify-center">
                            <i class="fas fa-landmark text-indigo-500 text-sm"></i>
                        </div>
                    </div>
                    <p class="text-3xl font-bold text-gray-900" th:text="${totalExhibitions}">0</p>
                    <p class="text-xs text-gray-400 mt-1">등록된 전시회 수</p>
                </div>
                <div class="bg-white rounded-xl border border-gray-200 p-5 shadow-sm">
                    <div class="flex items-center justify-between mb-3">
                        <p class="text-sm font-medium text-gray-500">작품</p>
                        <div class="w-9 h-9 rounded-lg bg-violet-50 flex items-center justify-center">
                            <i class="fas fa-palette text-violet-500 text-sm"></i>
                        </div>
                    </div>
                    <p class="text-3xl font-bold text-gray-900" th:text="${totalProductions}">0</p>
                    <p class="text-xs text-gray-400 mt-1">등록된 작품 합계</p>
                </div>
                <div class="bg-white rounded-xl border border-gray-200 p-5 shadow-sm">
                    <div class="flex items-center justify-between mb-3">
                        <p class="text-sm font-medium text-gray-500">파일</p>
                        <div class="w-9 h-9 rounded-lg bg-emerald-50 flex items-center justify-center">
                            <i class="fas fa-images text-emerald-500 text-sm"></i>
                        </div>
                    </div>
                    <p class="text-3xl font-bold text-gray-900" th:text="${totalFiles}">0</p>
                    <p class="text-xs text-gray-400 mt-1">업로드된 파일 합계</p>
                </div>
            </div>

            <!-- Exhibition List Card -->
            <div class="bg-white rounded-xl border border-gray-200 shadow-sm">
                <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between">
                    <h2 class="font-semibold text-gray-900">전시회 목록</h2>
                    <span class="text-sm text-gray-400" th:text="${totalExhibitions} + '개'"></span>
                </div>

                <!-- Empty state -->
                <div th:if="${exhibitions.isEmpty()}" class="flex flex-col items-center py-16 text-center">
                    <div class="w-16 h-16 rounded-2xl bg-gray-100 flex items-center justify-center mb-4">
                        <i class="fas fa-folder-open text-2xl text-gray-400"></i>
                    </div>
                    <p class="text-gray-700 font-medium">등록된 전시회가 없습니다</p>
                    <p class="text-gray-400 text-sm mt-1 mb-5">아래 버튼을 눌러 첫 전시회를 추가해보세요.</p>
                    <a th:href="@{/admin/exhibitions/new}"
                       class="inline-flex items-center gap-2 px-4 py-2 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700 transition-colors">
                        <i class="fas fa-plus text-xs"></i> 새 전시회 추가
                    </a>
                </div>

                <!-- Cards Grid -->
                <div th:unless="${exhibitions.isEmpty()}"
                     class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 p-6">
                    <div th:each="exhibition : ${exhibitions}"
                         class="group relative bg-white border border-gray-200 rounded-xl p-5 hover:border-indigo-200 hover:shadow-md transition-all duration-200 flex flex-col overflow-hidden">
                        <!-- Hover accent -->
                        <div class="absolute inset-x-0 top-0 h-0.5 bg-gradient-to-r from-indigo-500 to-violet-500 opacity-0 group-hover:opacity-100 transition-opacity"></div>

                        <!-- Icon + Title -->
                        <div class="flex items-start gap-3 mb-4">
                            <div class="w-10 h-10 rounded-lg bg-indigo-50 group-hover:bg-indigo-100 flex items-center justify-center flex-shrink-0 transition-colors">
                                <i class="fas fa-landmark text-indigo-500 text-sm"></i>
                            </div>
                            <h3 class="font-semibold text-gray-900 text-sm leading-snug break-words pt-1"
                                th:text="${exhibition.title}">전시회 제목</h3>
                        </div>

                        <!-- Meta -->
                        <div class="space-y-1.5 flex-grow mb-4">
                            <div class="flex items-center gap-2 text-xs text-gray-500">
                                <i class="fas fa-hashtag w-3 text-center text-gray-300"></i>
                                <span th:text="'ID ' + ${exhibition.id}"></span>
                            </div>
                            <div class="flex items-center gap-2 text-xs text-gray-500">
                                <i class="fas fa-palette w-3 text-center text-gray-300"></i>
                                <span th:text="${#lists.size(exhibition.productions)} + '개 작품'"></span>
                            </div>
                            <div class="flex items-center gap-2 text-xs text-gray-500">
                                <i class="fas fa-calendar-alt w-3 text-center text-gray-300"></i>
                                <span th:text="${#temporals.format(exhibition.createAt, 'yyyy-MM-dd')}"></span>
                            </div>
                        </div>

                        <!-- Actions -->
                        <div class="flex items-center justify-between pt-3 border-t border-gray-100">
                            <a th:href="@{/admin/exhibitions/{id}/productions(id=${exhibition.id})}"
                               class="flex items-center gap-1.5 text-xs font-semibold text-indigo-600 hover:text-indigo-800 transition-colors">
                                <i class="fas fa-pen-to-square"></i>
                                작품 관리
                            </a>
                            <button type="button"
                                    th:data-title="${exhibition.title}"
                                    th:data-href="@{/admin/exhibitions/{id}/delete(id=${exhibition.id})}"
                                    onclick="var t=this.dataset.title; showDeleteModal('전시회 삭제', '「'+t+'」 전시회를 삭제합니다. 모든 작품과 파일이 영구 삭제됩니다.', this.dataset.href)"
                                    class="flex items-center gap-1.5 text-xs font-medium text-gray-400 hover:text-red-500 transition-colors cursor-pointer">
                                <i class="fas fa-trash-alt"></i>
                                삭제
                            </button>
                        </div>
                    </div>
                </div>
            </div>

        </main>
    </div>
</div>

<div th:replace="~{admin/fragments/layout :: deleteModal}"></div>
</body>
</html>
